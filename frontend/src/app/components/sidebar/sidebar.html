<aside class="sidebar" [class.open]="mobileOpen" aria-label="Menú lateral">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="21" r="12" fill="none" stroke="var(--orange)" stroke-width="5"/>
      <circle cx="31" cy="9" r="5" fill="var(--peach)"/>
    </svg>
    <span class="brand-name">Círculo U</span>
    <button class="icon-btn only-mobile" style="margin-left:auto" type="button" aria-label="Cerrar menú" (click)="closeDrawer.emit()">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="nav" aria-label="Principal">
    @for (item of navItems; track item.route) {
      <button
        type="button"
        [class.active]="isActive(item.route)"
        [attr.aria-current]="isActive(item.route) ? 'page' : null"
        [routerLink]="item.route"
        (click)="closeDrawer.emit()"
        [title]="item.label">
        @switch (item.icon) {
          @case ('home') {
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
          }
          @case ('forum') {
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          }
          @case ('calendar') {
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
          }
          @case ('gamepad') {
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><path d="M15.5 11.5h.01M18 13.5h.01" stroke-width="2.6"/></svg>
          }
        }
        <span class="lbl">{{ item.label }}</span>
      </button>
    }
  </nav>

  <div class="side-foot only-desktop">
    <button type="button" [attr.aria-expanded]="!collapsed" [title]="collapsed ? 'Expandir menú' : 'Contraer menú'" (click)="toggleCollapse.emit()">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="lbl">{{ collapsed ? 'Expandir menú' : 'Contraer menú' }}</span>
    </button>
  </div>
  <div class="side-foot">
    <button type="button" (click)="cerrarSesion()" title="Cerrar sesión">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>
      <span class="lbl">Cerrar sesión</span>
    </button>
  </div>
</aside>
