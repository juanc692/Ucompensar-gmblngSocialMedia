<div class="card border-0 bc mb-3" style="min-height: 150px;">
  <div class="card-body">
    <h5>{{ title }}</h5>
    <p>{{ content }}</p>
    @if (costPoints > 0) {
      <small class="text-muted">Costo: {{ costPoints }} puntos</small>
    }
  </div>
  <button class="btn btn-bd-primary" style="width: 200px; align-self: center;" (click)="unirse()">
    Entrar
  </button>
</div>
