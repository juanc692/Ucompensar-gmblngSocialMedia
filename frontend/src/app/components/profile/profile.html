<div id="pop" class="pop" role="dialog" aria-label="Tu perfil">
  <div class="pop-top">
    <app-avatar [size]="52" [name]="nombre"></app-avatar>
    <div>
      <h2>{{ nombre }}</h2>
      <span class="badge">Estudiante</span>
      @if (email) {
        <p class="muted small" style="margin-top:4px">{{ email }}</p>
      }
    </div>
  </div>

  <div class="pop-points">
    <span class="ring">{{ puntosCuentaComponente }}</span>
    <div>
      <strong>Puntos de tu cuenta</strong>
      <p class="muted small">Gana puntos en Juegos y úsalos para crear actividades.</p>
    </div>
  </div>

  <div class="pop-foot">
    <button class="btn ghost sm" type="button" (click)="toggleTheme()">
      @if (isDark) {
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Modo claro
      } @else {
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
        Modo oscuro
      }
    </button>
    <button class="btn ghost sm" type="button" (click)="cerrarSesion()">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>
      Cerrar sesión
    </button>
  </div>
</div>
