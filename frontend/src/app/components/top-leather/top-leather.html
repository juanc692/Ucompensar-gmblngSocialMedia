<div class="card border-0 bc mb-3" style="height: 100%;">
  <div class="card-body text-center">
    <h4>TOP</h4>
    <ol>
      @for (user of topUsers; track user.id) {
        <li>{{ user.name }} — {{ user.points }} pts</li>
      }
      @empty {
        <li class="text-muted" style="list-style: none;">Sin datos aún</li>
      }
    </ol>
  </div>
</div>
