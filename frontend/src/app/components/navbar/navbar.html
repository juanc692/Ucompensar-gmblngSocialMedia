<header class="topbar">
  <button class="icon-btn only-mobile" type="button" aria-label="Abrir menú" (click)="toggleSidebar.emit()">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <div class="pop-wrap">
    <button
      class="chip-profile"
      type="button"
      [attr.aria-expanded]="profileOpen"
      (click)="toggleProfile.emit()">
      <app-avatar [size]="34" [name]="nombreUsuario"></app-avatar>
      <span class="chip-name">{{ firstName }}</span>
      <span class="pts"><i></i>{{ puntosCuentaComponente }} pts</span>
    </button>

    @if (profileOpen) {
      <app-profile [nombre]="nombreUsuario" (toggleProfile)="toggleProfile.emit()"></app-profile>
    }
  </div>
</header>
