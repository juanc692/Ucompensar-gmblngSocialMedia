<div class="login">
  <section class="login-form">
    <div class="login-inner">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="21" r="12" fill="none" stroke="var(--orange)" stroke-width="5"/>
          <circle cx="31" cy="9" r="5" fill="var(--peach)"/>
        </svg>
        <span class="brand-name">Círculo U</span>
      </div>
      <div>
        <h1>Entra a Círculo U</h1>
        <p class="sub">Solo para estudiantes, docentes y personal de la universidad. Inicia sesión con tu correo institucional.</p>
      </div>
      <form novalidate (ngSubmit)="entrar(userInput.value, passwordInput.value)">
        <div class="field">
          <label for="email">Correo institucional</label>
          <input id="email" type="email" autocomplete="username" placeholder="nombre.apellido@ucompensar.edu.co" #userInput>
        </div>
        <div class="field">
          <label for="pw">Contraseña</label>
          <input id="pw" type="password" autocomplete="current-password" #passwordInput>
        </div>
        @if (errorMsg) {
          <p class="err" role="alert">{{ errorMsg }}</p>
        }
        <button class="btn" type="submit">Iniciar sesión</button>
      </form>
    </div>
  </section>
  <aside class="login-art" aria-hidden="true">
    <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <circle class="a-orange" cx="400" cy="230" r="200" opacity=".92"/>
      <circle class="a-red" cx="545" cy="705" r="190"/>
      <circle class="a-ring-peach" cx="120" cy="640" r="92" fill="none" stroke-width="12"/>
      <circle class="a-peach" cx="150" cy="150" r="46"/>
      <circle class="a-ring-orange" cx="520" cy="470" r="28" fill="none" stroke-width="8"/>
      <g transform="translate(90 330)">
        <rect width="400" height="200" rx="30" class="a-card"/>
        <circle class="a-ring-orange" cx="72" cy="100" r="36" fill="none" stroke-width="5"/>
        <text x="72" y="102" text-anchor="middle" class="a-num">28</text>
        <text x="72" y="121" text-anchor="middle" class="a-sm">sep</text>
        <text x="134" y="88" class="a-title">Torneo de ajedrez</text>
        <text x="134" y="114" class="a-sub">Cafetería central, 3:00 p. m.</text>
        <rect x="134" y="132" width="96" height="30" rx="15" class="a-pill"/>
        <text x="182" y="153" text-anchor="middle" class="a-pilltxt">+25 pts</text>
      </g>
    </svg>
  </aside>
</div>
