<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
    
    <div class="text-center mb-4">
      <h3 class="fw-bold" style="color: #333;">Iniciar sesión</h3>
      <p class="text-muted small">Ingresa tus credenciales para acceder</p>
    </div>

    <form (ngSubmit)="entrar(userInput.value, passwordInput.value)">
      <div class="mb-3 text-start">
        <label for="username" class="form-label fw-semibold text-secondary">Nombre de usuario</label>
        <input 
          type="text" 
          id="username" 
          class="form-control form-control-lg" 
          placeholder="micorreo@ucompensar.edu.co"
          #userInput 
          required>
      </div>

      <div class="mb-4 text-start">
        <label for="password" class="form-label fw-semibold text-secondary">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          class="form-control form-control-lg" 
          placeholder="••••••••"
          #passwordInput 
          required>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-bd-primary btn-lg shadow-sm">
          Entrar
        </button>
      </div>
    </form>

  </div>
</div>
