<div class="container mt-4">

  <h2>Actividades recientes para ti, {{ userName }}</h2>
  <div class="row">
    <div class="col-md-8">
      <div class="row g-3">
        @for (activity of ultimasActividades; track activity.id) {
          <div class="col-md-6">
            <app-feed-card
              [title]="activity.name_activity"
              [content]="activity.description"
              [costPoints]="activity.cost_points"
              [activityId]="activity.id">
            </app-feed-card>
          </div>
        }
        @empty {
          <p class="text-muted">No hay actividades aún.</p>
        }
      </div>
    </div>

    <!-- ranking -->
    <div class="col-md-4">
      <app-top-leather></app-top-leather>
    </div>
  </div>

  <h2 class="mt-4">Últimas publicaciones</h2>
  <div class="row">
    @for (thread of ultimosThreads; track thread.id) {
      <app-posts-card
        [threadId]="thread.id"
        [title]="thread.title"
        [content]="thread.body"
        [category]="thread.category"
        [createdAt]="thread.created_at"
        [authorName]="thread.author_name || ''">
      </app-posts-card>
    }
    @empty {
      <p class="text-muted">No hay publicaciones aún.</p>
    }
  </div>

</div>
