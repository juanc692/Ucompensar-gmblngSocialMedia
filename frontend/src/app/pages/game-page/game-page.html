<div class="miniGamesCards row g-4">


     @for (game of dataGames(); track game.id){ <!--for para atraer a todo -->
        <div class="card text-bg-transparent h-100">
            <img [src]="game.image.replace('small', 'medium')" alt="" class="card-img">
            <div class="card-img-overlay cardBtn ">
                <a [href]="game.url" target="_blank" class="btn btn-bd-primary mb-2">Jugar</a>
            </div>
        </div>
    }@empty {
        <!-- cuando el array no carga -->
        <p class="loading">Cargando videojuegos desde GamePix...</p>
    }
